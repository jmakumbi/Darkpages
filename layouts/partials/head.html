<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Playfair+Display:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

{{ $brand := resources.Get "css/brand.css" | minify }}
<link rel="stylesheet" href="{{ $brand.RelPermalink }}">

{{- if and (not hugo.IsServer) (site.Params.goatcounter) }}
<img src="{{ site.Params.goatcounter }}?p={{ .RelPermalink | urlquery }}"
     style="position:absolute;width:0;height:0;visibility:hidden;"
     alt="" loading="eager" referrerpolicy="no-referrer-when-downgrade">
{{- end }}
