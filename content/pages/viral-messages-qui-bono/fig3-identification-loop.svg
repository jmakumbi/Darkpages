<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260">
  <rect width="760" height="260" fill="#d6cdb8"/>

  <!-- Title -->
  <text x="380" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#450f00">The Closed Identification Loop</text>

  <!-- Step boxes — 6 boxes across, y=58 to y=150, then return arc -->
  <!-- Box dimensions: w=96, h=56, gap=14 -->
  <!-- x positions: 18, 128, 238, 348, 458, 568, 678 — too many, adjust -->
  <!-- Use 6 steps at x: 18, 130, 242, 354, 466, 578 (gap=14, w=98) -->

  <!-- Step 1: Camera -->
  <rect x="18"  y="62" width="100" height="64" rx="4" fill="#e8e2d4" stroke="#450f00" stroke-opacity="0.2" stroke-width="1"/>
  <text x="68"  y="82" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#c47a22">CAMERA</text>
  <text x="68"  y="96" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#450f00">Naguru Safe</text>
  <text x="68"  y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#450f00">City Network</text>
  <text x="68"  y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#450f00" fill-opacity="0.6">captures face</text>

  <!-- Arrow 1→2 -->
  <line x1="120" y1="94" x2="134" y2="94" stroke="#450f00" stroke-opacity="0.4" stroke-width="1.5"/>
  <polygon points="134,90 142,94 134,98" fill="#450f00" fill-opacity="0.4"/>

  <!-- Step 2: NIRA DB -->
  <rect x="144" y="62" width="100" height="64" rx="4" fill="#e8e2d4" stroke="#450f00" stroke-opacity="0.2" stroke-width="1"/>
  <text x="194" y="82"  text-anchor="middle" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#c47a22">NIRA DB</text>
  <text x="194" y="96"  text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#450f00">Biometric</text>
  <text x="194" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#450f00">face match</text>
  <text x="194" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#450f00" fill-opacity="0.6">returns NIN</text>

  <!-- Arrow 2→3 -->
  <line x1="246" y1="94" x2="260" y2="94" stroke="#450f00" stroke-opacity="0.4" stroke-width="1.5"/>
  <polygon points="260,90 268,94 260,98" fill="#450f00" fill-opacity="0.4"/>

  <!-- Step 3: SIM Registry — THE KEYSTONE (highlighted) -->
  <rect x="270" y="50" width="100" height="84" rx="4" fill="#450f00" stroke="#c47a22" stroke-width="2"/>
  <text x="320" y="68"  text-anchor="middle" font-family="'Courier New', monospace" font-size="7" font-weight="700" fill="#c47a22" letter-spacing="0.06em">THE KEYSTONE</text>
  <text x="320" y="82"  text-anchor="middle" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#d6cdb8">SIM-NIN</text>
  <text x="320" y="94"  text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#d6cdb8">REGISTRY</text>
  <text x="320" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#d6cdb8" fill-opacity="0.7">NIN → MSISDN</text>
  <text x="320" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#d6cdb8" fill-opacity="0.7">biometric-linked</text>

  <!-- Arrow 3→4 -->
  <line x1="372" y1="94" x2="386" y2="94" stroke="#450f00" stroke-opacity="0.4" stroke-width="1.5"/>
  <polygon points="386,90 394,94 386,98" fill="#450f00" fill-opacity="0.4"/>

  <!-- Step 4: MTN/Airtel -->
  <rect x="396" y="62" width="100" height="64" rx="4" fill="#e8e2d4" stroke="#450f00" stroke-opacity="0.2" stroke-width="1"/>
  <text x="446" y="82"  text-anchor="middle" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#c47a22">MTN/AIRTEL</text>
  <text x="446" y="96"  text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#450f00">CGNAT logs</text>
  <text x="446" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#450f00">MSISDN map</text>
  <text x="446" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#450f00" fill-opacity="0.6">real-time location</text>

  <!-- Arrow 4→5 -->
  <line x1="498" y1="94" x2="512" y2="94" stroke="#450f00" stroke-opacity="0.4" stroke-width="1.5"/>
  <polygon points="512,90 520,94 512,98" fill="#450f00" fill-opacity="0.4"/>

  <!-- Step 5: UCC / RICA -->
  <rect x="522" y="62" width="100" height="64" rx="4" fill="#e8e2d4" stroke="#450f00" stroke-opacity="0.2" stroke-width="1"/>
  <text x="572" y="82"  text-anchor="middle" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#c47a22">UCC / RICA</text>
  <text x="572" y="96"  text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#450f00">Interception</text>
  <text x="572" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#450f00">framework</text>
  <text x="572" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#450f00" fill-opacity="0.6">all comms metadata</text>

  <!-- Arrow 5→6 -->
  <line x1="624" y1="94" x2="638" y2="94" stroke="#450f00" stroke-opacity="0.4" stroke-width="1.5"/>
  <polygon points="638,90 646,94 638,98" fill="#450f00" fill-opacity="0.4"/>

  <!-- Step 6: Identity resolved -->
  <rect x="648" y="62" width="100" height="64" rx="4" fill="#e8e2d4" stroke="#450f00" stroke-opacity="0.2" stroke-width="1"/>
  <text x="698" y="82"  text-anchor="middle" font-family="'Courier New', monospace" font-size="8" font-weight="700" fill="#c47a22">IDENTITY</text>
  <text x="698" y="96"  text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#450f00">Name · address</text>
  <text x="698" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#450f00">contacts · location</text>
  <text x="698" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="#450f00" fill-opacity="0.6">fully resolved</text>

  <!-- Return arc from IDENTITY back to CAMERA (loop indicator) -->
  <path d="M 698 128 Q 698 178 380 178 Q 68 178 68 128" fill="none" stroke="#c47a22" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="5,4"/>
  <polygon points="68,128 64,136 72,136" fill="#c47a22" fill-opacity="0.35"/>
  <text x="380" y="196" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#c47a22" fill-opacity="0.6">closed loop — no international cooperation required</text>

  <!-- Domestic sovereign label -->
  <rect x="18" y="218" width="724" height="1" fill="#450f00" fill-opacity="0.12"/>
  <text x="380" y="232" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#450f00" fill-opacity="0.5">All steps operate within domestically controlled infrastructure · No platform cooperation required · No conventional warrant threshold</text>
  <text x="380" y="248" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#450f00" fill-opacity="0.4">SIM-NIN mandate (2022) is the keystone — without it, the face-to-communications-record link cannot be closed</text>
</svg>
