<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  <rect width="900" height="900" fill="#d6cdb8"></rect>
  <text x="450" y="54" text-anchor="middle" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#450f00">Engagement 7 — What Was Tested</text>

  
  <circle cx="120" cy="140" r="20" fill="#c47a22"></circle>
  <text x="120" y="146" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#d6cdb8">1</text>
  <rect x="165" y="110" width="600" height="60" rx="5" fill="#e8e2d4" stroke="#450f00" stroke-opacity="0.2"></rect>
  <text x="185" y="135" font-family="'Courier New', monospace" font-size="11.5" font-weight="700" fill="#450f00">SCOPE</text>
  <text x="185" y="153" font-family="'Courier New', monospace" font-size="10.5" fill="#450f00" fill-opacity="0.8">IceWhale's implementation only — not ZeroTier Inc. or the protocol</text>

  <line x1="120" y1="160" x2="120" y2="210" stroke="#450f00" stroke-opacity="0.35" stroke-width="1.5"></line>

  
  <circle cx="120" cy="240" r="20" fill="#c47a22"></circle>
  <text x="120" y="246" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#d6cdb8">2</text>
  <rect x="165" y="210" width="600" height="60" rx="5" fill="#e8e2d4" stroke="#450f00" stroke-opacity="0.2"></rect>
  <text x="185" y="235" font-family="'Courier New', monospace" font-size="11.5" font-weight="700" fill="#450f00">STATIC ANALYSIS</text>
  <text x="185" y="253" font-family="'Courier New', monospace" font-size="10.5" fill="#450f00" fill-opacity="0.8">ZimaOS ZeroTier binary decompiled, every outbound call traced</text>

  <line x1="120" y1="260" x2="120" y2="310" stroke="#450f00" stroke-opacity="0.35" stroke-width="1.5"></line>

  
  <circle cx="120" cy="340" r="20" fill="#c47a22"></circle>
  <text x="120" y="346" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#d6cdb8">3</text>
  <rect x="165" y="310" width="600" height="60" rx="5" fill="#e8e2d4" stroke="#450f00" stroke-opacity="0.2"></rect>
  <text x="185" y="335" font-family="'Courier New', monospace" font-size="11.5" font-weight="700" fill="#450f00">TRANSPORT CHECK</text>
  <text x="185" y="353" font-family="'Courier New', monospace" font-size="10.5" fill="#450f00" fill-opacity="0.8">Confirmed controller + relays are ZeroTier Inc.'s, not IceWhale's</text>

  <line x1="120" y1="360" x2="120" y2="410" stroke="#450f00" stroke-opacity="0.35" stroke-width="1.5"></line>

  
  <circle cx="120" cy="440" r="20" fill="#c47a22"></circle>
  <text x="120" y="446" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#d6cdb8">4</text>
  <rect x="165" y="410" width="600" height="60" rx="5" fill="#e8e2d4" stroke="#450f00" stroke-opacity="0.2"></rect>
  <text x="185" y="435" font-family="'Courier New', monospace" font-size="11.5" font-weight="700" fill="#450f00">FIELD AUDIT</text>
  <text x="185" y="453" font-family="'Courier New', monospace" font-size="10.5" fill="#450f00" fill-opacity="0.8">4 ZimaOS devices, member lists inspected — 3 had unidentified peers</text>

  <line x1="120" y1="460" x2="120" y2="510" stroke="#450f00" stroke-opacity="0.35" stroke-width="1.5"></line>

  
  <circle cx="120" cy="555" r="20" fill="#450f00" stroke="#c47a22" stroke-width="2"></circle>
  <text x="120" y="561" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#c47a22">5</text>
  <rect x="165" y="515" width="600" height="80" rx="5" fill="#450f00" stroke="#c47a22" stroke-width="1.5"></rect>
  <text x="185" y="545" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#c47a22">FINDINGS</text>
  <text x="185" y="565" font-family="'Courier New', monospace" font-size="10.5" fill="#d6cdb8" fill-opacity="0.85">0 vendor backdoors · 0 traffic brokering · 0 membership exfiltration</text>
  <text x="185" y="582" font-family="'Courier New', monospace" font-size="10.5" fill="#d6cdb8" fill-opacity="0.85">2 real defaults-configuration issues, unrelated to vendor trust</text>

  <rect x="60" y="660" width="780" height="1" fill="#450f00" fill-opacity="0.15"></rect>
  <text x="450" y="688" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#450f00" fill-opacity="0.6">A month of assuming, settled by one engagement of actually checking.</text>
