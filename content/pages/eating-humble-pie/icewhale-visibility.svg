  <text x="245" y="286" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#450f00">controller nor the relays</text>

  <line x1="245" y1="310" x2="245" y2="344" stroke="#450f00" stroke-opacity="0.4" stroke-width="1.5"></line>
  <polygon points="245,344 238,332 252,332" fill="#450f00" fill-opacity="0.4"></polygon>

