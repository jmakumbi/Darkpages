  <text x="655" y="286" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#450f00">checks + forum announcements</text>

  <line x1="655" y1="310" x2="655" y2="344" stroke="#450f00" stroke-opacity="0.4" stroke-width="1.5"></line>
  <polygon points="655,344 648,332 662,332" fill="#450f00" fill-opacity="0.4"></polygon>

  <rect x="515" y="350" width="280" height="86" rx="5" fill="#450f00" stroke="#1a5c38" stroke-width="2"></rect>
  <text x="655" y="384" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#8fd6ac">✓ NO UPLOAD CODE PATH</text>
