  <rect x="60" y="470" width="780" height="1" fill="#450f00" fill-opacity="0.15"></rect>
  <text x="450" y="500" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#450f00">Two independent checks. Both came back clean.</text>
  <text x="450" y="524" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#450f00" fill-opacity="0.6" font-style="italic">That's not benefit of the doubt — it's a verified result.</text>
