<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  <rect width="900" height="900" fill="#d6cdb8"></rect>
  <text x="450" y="54" text-anchor="middle" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#450f00">Public by Default</text>

  <circle cx="450" cy="470" r="300" fill="none" stroke="#c47a22" stroke-width="2" stroke-dasharray="9,7" stroke-opacity="0.6"></circle>
  <text x="450" y="190" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="0.08em" fill="#c47a22">PUBLIC NETWORK — VISIBLE TO ANYONE WITH THE ID</text>

  <rect x="366" y="410" width="168" height="120" rx="6" fill="#e8e2d4" stroke="#450f00" stroke-opacity="0.25" stroke-width="1.5"></rect>
  <text x="450" y="450" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#c47a22">ZIMAOS DEVICE</text>
  <text x="450" y="470" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#450f00">controller: self-hosted</text>
  <text x="450" y="486" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#450f00">on the device itself</text>
  <text x="450" y="510" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#450f00" fill-opacity="0.6">16-hex network ID</text>

  
  <line x1="120" y1="290" x2="290" y2="400" stroke="#450f00" stroke-width="1.75" stroke-opacity="0.55"></line>
  <polygon points="290,400 273,392 280,414" fill="#450f00" fill-opacity="0.55"></polygon>
  <circle cx="100" cy="278" r="13" fill="#450f00" fill-opacity="0.7"></circle>
  <text x="100" y="330" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#450f00" fill-opacity="0.7">unidentified</text>

  <line x1="780" y1="300" x2="605" y2="405" stroke="#450f00" stroke-width="1.75" stroke-opacity="0.55"></line>
  <polygon points="605,405 615,386 625,406" fill="#450f00" fill-opacity="0.55"></polygon>
  <circle cx="800" cy="286" r="13" fill="#450f00" fill-opacity="0.7"></circle>
  <text x="800" y="338" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#450f00" fill-opacity="0.7">unidentified</text>

  <line x1="450" y1="770" x2="450" y2="535" stroke="#c47a22" stroke-width="2"></line>
  <polygon points="450,535 440,552 460,552" fill="#c47a22"></polygon>
  <circle cx="450" cy="790" r="14" fill="#c47a22"></circle>
  <text x="450" y="838" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#450f00">auto-joined · roughly 5 months, one case</text>

  <rect x="60" y="856" width="780" height="1" fill="#450f00" fill-opacity="0.15"></rect>
  <text x="450" y="878" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#450f00" fill-opacity="0.6">A reset evicts current members — the fresh network comes back public too.</text>
</svg>