<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000">
  <rect width="900" height="1000" fill="#d6cdb8"></rect>
  <text x="450" y="54" text-anchor="middle" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#450f00">The Real Attack Path</text>

  
  <rect x="250" y="100" width="400" height="90" rx="5" fill="#e8e2d4" stroke="#450f00" stroke-opacity="0.2" stroke-width="1.5"></rect>
  <text x="450" y="132" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#c47a22">UNIDENTIFIED DEVICE</text>
  <text x="450" y="152" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#450f00">joins the public overlay</text>
  <text x="450" y="170" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#450f00" fill-opacity="0.6">has the 16-hex network ID, nothing else</text>

  <line x1="450" y1="190" x2="450" y2="240" stroke="#450f00" stroke-opacity="0.5" stroke-width="2"></line>
  <polygon points="450,240 440,222 460,222" fill="#450f00" fill-opacity="0.5"></polygon>

  
  <rect x="210" y="248" width="480" height="130" rx="5" fill="#450f00" stroke="#c47a22" stroke-width="2.5"></rect>
  <text x="450" y="278" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" font-weight="700" letter-spacing="0.1em" fill="#c47a22">THE ACTUAL VULNERABILITY</text>
  <text x="450" y="304" text-anchor="middle" font-family="'Courier New', monospace" font-size="15" font-weight="700" fill="#d6cdb8">ttyd — web terminal</text>
  <text x="450" y="326" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#d6cdb8" fill-opacity="0.85">binds to all interfaces</text>
  <text x="450" y="344" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#d6cdb8" fill-opacity="0.85">no authentication required</text>
  <text x="450" y="364" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#c47a22" fill-opacity="0.85">reachable the moment you're on the overlay</text>

  <line x1="450" y1="378" x2="450" y2="428" stroke="#450f00" stroke-opacity="0.5" stroke-width="2"></line>
  <polygon points="450,428 440,410 460,410" fill="#450f00" fill-opacity="0.5"></polygon>

  
  <rect x="250" y="436" width="400" height="90" rx="5" fill="#e8e2d4" stroke="#7b1818" stroke-width="1.5"></rect>
  <text x="450" y="468" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#7b1818">ROOT SHELL</text>
  <text x="450" y="488" text-anchor="middle" font-family="'Courier New', monospace" font-size="10.5" fill="#450f00">on the box holding engagement data</text>
  <text x="450" y="506" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#450f00" fill-opacity="0.6">whoever or whatever joined, unverifiable after the fact</text>

  <rect x="60" y="580" width="780" height="1" fill="#450f00" fill-opacity="0.15"></rect>
  <text x="450" y="614" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#450f00" font-style="italic">ZeroTier was the road. It wasn't the open door.</text>
</svg>