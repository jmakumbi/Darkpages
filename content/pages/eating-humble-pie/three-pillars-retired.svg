<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  <rect width="900" height="900" fill="#d6cdb8"></rect>
  <text x="450" y="54" text-anchor="middle" font-family="Georgia, serif" font-size="21" font-weight="700" fill="#450f00">zima-harden: Three Pillars, One Retired</text>

  
  <rect x="60" y="90" width="780" height="46" fill="#450f00"></rect>
  <text x="450" y="118" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="0.08em" fill="#c47a22">PILLAR</text>
  <text x="450" y="118" font-family="'Courier New', monospace" font-size="11"></text>
  <line x1="410" y1="90" x2="410" y2="820" stroke="#450f00" stroke-opacity="0.15"></line>
  <line x1="655" y1="90" x2="655" y2="820" stroke="#450f00" stroke-opacity="0.15"></line>
  <text x="235" y="118" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="0.05em" fill="#c47a22">PILLAR</text>
  <text x="532" y="118" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="0.05em" fill="#c47a22">STATUS</text>
  <text x="748" y="118" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="0.05em" fill="#c47a22">WHY</text>

  
  <rect x="60" y="136" width="780" height="110" fill="#e8e2d4"></rect>
  <text x="235" y="176" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#450f00">SSH restoration</text>
  <text x="235" y="196" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#450f00" fill-opacity="0.65">puts root SSH back</text>
  <text x="532" y="182" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#1a5c38">KEPT</text>
  <text x="748" y="176" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#450f00" fill-opacity="0.75">Stands on its own merits</text>
  <text x="748" y="194" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#450f00" fill-opacity="0.75">discipline, not disabling, is the fix</text>

  
  <rect x="60" y="246" width="780" height="110" fill="#d6cdb8"></rect>
  <text x="235" y="286" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#450f00">Configurable firewall</text>
  <text x="235" y="306" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#450f00" fill-opacity="0.65">host-level rules</text>
  <text x="532" y="292" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#1a5c38">KEPT</text>
  <text x="748" y="286" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#450f00" fill-opacity="0.75">Independently useful,</text>
  <text x="748" y="304" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#450f00" fill-opacity="0.75">unrelated to the ZeroTier finding</text>

  
  <rect x="60" y="356" width="780" height="130" fill="#450f00"></rect>
  <text x="235" y="404" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#d6cdb8">ZeroTier lockdown</text>
  <text x="235" y="424" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#d6cdb8" fill-opacity="0.65">mask znet.service,</text>
  <text x="235" y="440" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#d6cdb8" fill-opacity="0.65">blackhole phone-home</text>
  <text x="532" y="404" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#c47a22">REMOVED</text>
  <line x1="500" y1="410" x2="565" y2="398" stroke="#c47a22" stroke-width="1.5"></line>
  <text x="748" y="404" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#d6cdb8" fill-opacity="0.8">Verified: not the vulnerability.</text>
  <text x="748" y="422" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#d6cdb8" fill-opacity="0.8">Masking on principle no longer</text>
  <text x="748" y="438" text-anchor="middle" font-family="'Courier New', monospace" font-size="9.5" fill="#d6cdb8" fill-opacity="0.8">holds up once you've checked.</text>

  <text x="450" y="530" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#450f00" fill-opacity="0.6" font-style="italic">Project is being renamed to reflect what's left.</text>
</svg>